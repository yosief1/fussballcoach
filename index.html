
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07130f">
<meta name="description" content="FussballCoach – trainiere, lerne und verbessere dein Fußballspiel.">
<title>FussballCoach</title>
<style>
:root {
  --bg: #07130f;
  --panel: #101f19;
  --panel2: #162920;
  --green: #b7f566;
  --green2: #83d94b;
  --text: #f2f7f2;
  --muted: #9caf9f;
  --line: rgba(255,255,255,.09);
  --orange: #ffbd69;
  --radius: 22px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse at 90% 0%, rgba(74,140,75,.15), transparent 38%),
    var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100vh;
}
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 3px;
}
.app { max-width: 760px; margin: auto; padding: 0 18px 110px; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 23px 0 20px; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  display: grid; place-items: center;
  width: 45px; height: 45px; border-radius: 15px;
  background: var(--green); color: #102015;
  font-size: 17px; font-weight: 1000; letter-spacing: -1px;
  transform: rotate(-3deg);
}
.brand-name { line-height: 1.05; }
.brand-name span {
  display: block; font-size: 11px; letter-spacing: 2.4px;
  color: var(--muted); font-weight: 800;
}
.brand-name strong { display: block; font-size: 21px; letter-spacing: -.7px; }
.status-pill {
  border: 1px solid var(--line); border-radius: 99px;
  padding: 9px 11px; color: var(--muted);
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  white-space: nowrap;
}
.status-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--green); margin-right: 6px;
}
#main { min-height: 65vh; }
.eyebrow {
  text-transform: uppercase; letter-spacing: 2px;
  color: var(--green); font-weight: 900; font-size: 11px;
}
h1 { margin: 8px 0 10px; font-size: clamp(29px, 7vw, 42px); line-height: 1.08; letter-spacing: -1.6px; }
h2 { margin: 0; font-size: 21px; letter-spacing: -.5px; }
h3 { margin: 0; font-size: 16px; }
p { color: var(--muted); line-height: 1.55; }
.subheading { max-width: 480px; margin: 0 0 23px; font-size: 14px; }
.hero {
  position: relative; overflow: hidden;
  border-radius: 28px; padding: 24px;
  background: linear-gradient(140deg, #25472d 0%, #163423 55%, #10231a 100%);
  border: 1px solid rgba(183,245,102,.17);
  margin-bottom: 19px;
}
.hero:after {
  content: "⚽"; position: absolute; right: -7px; top: 25px;
  font-size: 115px; opacity: .12; transform: rotate(-19deg);
  pointer-events: none;
}
.hero h1 { max-width: 360px; position: relative; z-index: 1; }
.hero p { max-width: 380px; font-size: 14px; position: relative; z-index: 1; }
.hero .btn { position: relative; z-index: 1; margin-top: 9px; }
.hero-label {
  display: inline-flex; align-items: center; gap: 7px;
  border-radius: 99px; background: rgba(183,245,102,.12);
  color: var(--green); padding: 7px 10px;
  font-size: 10px; font-weight: 900; letter-spacing: 1px;
}
.btn {
  border: 0; border-radius: 13px; padding: 13px 17px;
  background: var(--green); color: #112013; font-weight: 900;
  font-size: 13px; display: inline-flex; justify-content: center;
  align-items: center; gap: 8px; transition: transform .15s, opacity .15s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { cursor: default; opacity: .65; }
.btn.full { width: 100%; }
.btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn.small { padding: 10px 13px; }
.stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 17px 0 25px; }
.stat {
  border: 1px solid var(--line); background: rgba(16,31,25,.88);
  border-radius: 18px; padding: 15px 12px; min-width: 0;
}
.stat-icon { font-size: 19px; margin-bottom: 8px; }
.stat-value { font-size: 22px; font-weight: 950; letter-spacing: -.8px; }
.stat-label { color: var(--muted); font-size: 11px; margin-top: 3px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 25px 0 13px; }
.text-link { background: none; border: 0; color: var(--green); font-size: 12px; font-weight: 800; padding: 6px 0; }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; margin-bottom: 12px;
}
.card-top { display: flex; align-items: flex-start; gap: 13px; }
.card-icon {
  width: 47px; height: 47px; flex: 0 0 47px;
  display: grid; place-items: center; border-radius: 15px;
  background: var(--panel2); font-size: 23px;
}
.card-content { flex: 1; min-width: 0; }
.card-content p { font-size: 13px; margin: 6px 0 0; }
.meta { display: flex; flex-wrap: wrap; gap: 7px; margin: 13px 0; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 9px; border-radius: 8px; background: var(--panel2);
  color: var(--muted); font-size: 11px; font-weight: 800;
}
.chip.green { color: var(--green); background: rgba(183,245,102,.1); }
.progress-track {
  height: 7px; overflow: hidden; border-radius: 99px;
  background: #25372c; margin: 10px 0;
}
.progress-fill {
  height: 100%; width: 0; background: var(--green);
  border-radius: inherit; transition: width .3s;
}
.progress-label { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted); }
.exercise { padding: 18px; }
.exercise.completed { border-color: rgba(183,245,102,.32); }
.exercise-steps { padding-left: 22px; margin: 15px 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
.exercise-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.notice {
  padding: 14px 16px; border-radius: 15px;
  background: rgba(183,245,102,.08); border: 1px solid rgba(183,245,102,.15);
  color: var(--muted); font-size: 12px; line-height: 1.6;
}
.notice strong { color: var(--green); }
.page-intro { margin: 10px 0 23px; }
.page-intro p { margin: 0; font-size: 14px; }
.quiz-count { font-size: 12px; color: var(--muted); font-weight: 800; }
.quiz-options { display: grid; gap: 10px; margin: 22px 0 14px; }
.option {
  width: 100%; text-align: left; display: flex; gap: 12px; align-items: center;
  background: #13231b; color: var(--text); border: 1px solid var(--line);
  border-radius: 15px; padding: 14px; font-size: 14px;
}
.option-letter {
  width: 30px; height: 30px; flex: 0 0 30px;
  border-radius: 10px; display: grid; place-items: center;
  background: #26372c; color: var(--green); font-weight: 900;
}
.option:disabled { cursor: default; opacity: .85; }
.option.correct { border-color: var(--green); background: rgba(183,245,102,.1); }
.option.wrong { border-color: #ef8a72; background: rgba(239,138,114,.08); }
.feedback {
  border-radius: 15px; padding: 15px; margin: 14px 0;
  background: var(--panel2); font-size: 13px; line-height: 1.6;
}
.feedback.good { border: 1px solid rgba(183,245,102,.35); }
.feedback.bad { border: 1px solid rgba(239,138,114,.35); }
.profile-head {
  display: flex; align-items: center; gap: 15px; padding: 21px;
  background: linear-gradient(130deg, #193d29, #102019);
  border: 1px solid var(--line); border-radius: 24px; margin-bottom: 14px;
}
.avatar {
  display: grid; place-items: center; width: 68px; height: 68px;
  flex: 0 0 68px; border-radius: 21px; background: var(--green);
  color: #112013; font-size: 28px; font-weight: 1000;
}
.profile-name { font-size: 23px; font-weight: 950; }
input {
  color: var(--text); background: #0b1912; border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; width: 100%; min-width: 0;
}
.input-row { display: flex; align-items: center; gap: 9px; margin-top: 13px; }
.input-row .btn { flex: 0 0 auto; }
.badges { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
.badge-card { padding: 15px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel); }
.badge-emoji { font-size: 25px; margin-bottom: 10px; filter: grayscale(1); opacity: .5; }
.badge-card.unlocked { border-color: rgba(183,245,102,.3); }
.badge-card.unlocked .badge-emoji { filter: none; opacity: 1; }
.badge-title { font-size: 13px; font-weight: 900; }
.badge-desc { margin-top: 5px; font-size: 11px; color: var(--muted); line-height: 1.5; }
.empty-state { text-align: center; padding: 28px 10px; color: var(--muted); }
.empty-state .big-emoji { font-size: 42px; margin-bottom: 12px; }
.bottom-nav {
  position: fixed; z-index: 10; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; max-width: 760px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  background: rgba(7,19,15,.95); backdrop-filter: blur(18px);
  border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4,1fr);
}
.nav-item {
  color: #829487; border: 0; background: transparent; border-radius: 13px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 8px 2px; font-size: 10px; font-weight: 800;
}
.nav-icon { font-size: 20px; line-height: 1.1; }
.nav-item.active { color: var(--green); background: rgba(183,245,102,.08); }
.toast {
  visibility: hidden; opacity: 0; position: fixed; z-index: 20;
  bottom: 91px; left: 50%; transform: translateX(-50%) translateY(8px);
  width: max-content; max-width: calc(100% - 32px);
  border: 1px solid rgba(183,245,102,.35); background: #1c3527;
  color: var(--text); padding: 13px 17px; border-radius: 14px;
  font-size: 13px; font-weight: 800; box-shadow: 0 12px 35px #0005;
  transition: .2s; text-align: center;
}
.toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
.footer-note { font-size: 10px; line-height: 1.6; color: #718276; text-align: center; margin: 28px 0 10px; }
@media(min-width:600px) {
  .app { padding-left: 26px; padding-right: 26px; }
  .hero { padding: 32px; }
  .training-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; align-items: start; }
  .training-grid .card { margin: 0; }
}
@media(max-width:370px) {
  .app { padding-left: 12px; padding-right: 12px; }
  .hero { padding: 19px; }
  .status-pill { font-size: 9px; padding: 8px; }
  .stat { padding: 12px 8px; }
  .stat-value { font-size: 19px; }
  .stats-grid { gap: 7px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">FC</div>
      <div class="brand-name"><span>DEIN PERSÖNLICHER</span><strong>FussballCoach</strong></div>
    </div>
    <div class="status-pill"><span class="status-dot"></span>DEIN TRAINING</div>
  </header>
  <main id="main" aria-live="polite"></main>
  <p class="footer-note">FUSSBALLCOACH · TRAINIER CLEVER · SPIEL MIT KOPF</p>
</div>

<nav class="bottom-nav" aria-label="Hauptnavigation">
  <button class="nav-item active" data-screen="home"><span class="nav-icon">⌂</span>Start</button>
  <button class="nav-item" data-screen="training"><span class="nav-icon">⚽</span>Training</button>
  <button class="nav-item" data-screen="quiz"><span class="nav-icon">🧠</span>Quiz</button>
  <button class="nav-item" data-screen="profile"><span class="nav-icon">♙</span>Profil</button>
</nav>
<div id="toast" class="toast" role="status"></div>

<script>
"use strict";

const STORAGE_KEY = "fussballcoach-save-v2";

const EXERCISES = [
  {
    id: "control",
    icon: "⚽",
    title: "Ballkontrolle",
    category: "Technik",
    duration: "10 Min.",
    difficulty: "Einfach",
    description: "Werde sicherer am Ball und verbessere deine ersten Kontakte.",
    focus: "Enge Ballführung",
    steps: [
      "Lege 4 Gegenstände mit etwas Abstand als Slalom auf.",
      "Dribble langsam hindurch und nutze beide Füße.",
      "Wiederhole den Slalom mit etwas höherem Tempo.",
      "Versuche, den Ball bei jeder Berührung unter Kontrolle zu halten."
    ]
  },
  {
    id: "passing",
    icon: "🎯",
    title: "Passgenauigkeit",
    category: "Passen",
    duration: "10 Min.",
    difficulty: "Einfach",
    description: "Trainiere flache, genaue Pässe mit beiden Füßen.",
    focus: "Innenseitpass",
    steps: [
      "Markiere an einer Wand oder mit zwei Gegenständen ein Ziel.",
      "Spiele den Ball kontrolliert mit der Innenseite.",
      "Nimm den zurückkommenden Ball mit dem ersten Kontakt an.",
      "Wechsle nach einigen Wiederholungen den Fuß."
    ]
  },
  {
    id: "scan",
    icon: "👀",
    title: "Kopf hoch!",
    category: "Spielintelligenz",
    duration: "5 Min.",
    difficulty: "Mittel",
    description: "Lerne, vor der Ballannahme deine Umgebung zu prüfen.",
    focus: "Orientierung",
    steps: [
      "Bitte eine andere Person, sich links oder rechts von dir zu bewegen.",
      "Schau kurz über beide Schultern, bevor du den Pass annimmst.",
      "Nimm den Ball so an, dass du ins freie Feld starten kannst.",
      "Ohne Partner: Nutze wechselnde Zielpunkte und sprich sie laut aus."
    ]
  },
  {
    id: "weakfoot",
    icon: "🦶",
    title: "Schwacher Fuß",
    category: "Technik",
    duration: "8 Min.",
    difficulty: "Mittel",
    description: "Gib deinem weniger starken Fuß mehr Sicherheit.",
    focus: "Beidfüßigkeit",
    steps: [
      "Beginne mit ruhigen, kurzen Pässen.",
      "Stoppe den Ball bewusst mit dem schwächeren Fuß.",
      "Spiele den nächsten Pass mit diesem Fuß.",
      "Steigere das Tempo erst, wenn die Bewegung sauber bleibt."
    ]
  },
  {
    id: "movement",
    icon: "🏃",
    title: "Freilaufen",
    category: "Taktik",
    duration: "8 Min.",
    difficulty: "Mittel",
    description: "Finde freie Räume, statt direkt hinter einem Gegenspieler zu stehen.",
    focus: "Anspielbar werden",
    steps: [
      "Stelle dir vor, du stehst neben einem Gegenspieler.",
      "Mache erst eine kleine Bewegung weg vom Ball.",
      "Starte dann in einen freien Raum, um anspielbar zu werden.",
      "Wiederhole die Bewegung in verschiedene Richtungen."
    ]
  },
  {
    id: "balance",
    icon: "💨",
    title: "Koordination",
    category: "Athletik",
    duration: "6 Min.",
    difficulty: "Einfach",
    description: "Verbessere Balance und Bewegungsgefühl mit Ball.",
    focus: "Körperkontrolle",
    steps: [
      "Beginne mit leichtem Dribbling auf der Stelle.",
      "Wechsle abwechselnd den Innen- und Außenrist.",
      "Nimm kleine Schritte und halte den Oberkörper entspannt.",
      "Mache kurze Pausen und achte auf eine saubere Bewegung."
    ]
  }
];

const QUESTIONS = [
  {
    id: "q1",
    question: "Wie viele Spieler einer Mannschaft stehen beim normalen Fußball zu Spielbeginn auf dem Feld?",
    options: ["9", "10", "11", "12"],
    answer: 2,
    explanation: "Eine Mannschaft beginnt normalerweise mit elf Spielern, einschließlich Torwart."
  },
  {
    id: "q2",
    question: "Was bedeutet es, sich vor der Ballannahme zu orientieren?",
    options: [
      "Nur auf den Ball zu schauen",
      "Kurz die Umgebung und freie Räume zu prüfen",
      "Sofort zum Tor zu schießen",
      "Immer stehen zu bleiben"
    ],
    answer: 1,
    explanation: "Durch einen kurzen Blick über die Schulter erkennst du freie Räume und mögliche Anspielstationen."
  },
  {
    id: "q3",
    question: "Mit welchem Fußteil spielst du einen kurzen, genauen Pass häufig?",
    options: ["Mit der Ferse", "Mit der Innenseite", "Mit dem Knie", "Mit der Fußspitze immer"],
    answer: 1,
    explanation: "Die Innenseite bietet bei vielen kurzen Pässen eine gute Kontaktfläche und Kontrolle."
  },
  {
    id: "q4",
    question: "Was ist bei einem guten ersten Kontakt wichtig?",
    options: [
      "Den Ball möglichst weit wegzuspielen",
      "Den Ball immer zu stoppen",
      "Den Ball in eine hilfreiche Richtung mitzunehmen",
      "Den Ball gar nicht zu berühren"
    ],
    answer: 2,
    explanation: "Ein guter erster Kontakt bringt den Ball in eine Position, von der aus du die nächste Aktion spielen kannst."
  },
  {
    id: "q5",
    question: "Wann ist ein Spieler im Abseits?",
    options: [
      "Bei jedem Pass nach vorne",
      "Wenn er in der eigenen Hälfte steht",
      "Wenn die Abseitsbedingungen erfüllt sind und er aktiv ins Spiel eingreift",
      "Immer, wenn er näher am Tor als der Ball steht"
    ],
    answer: 2,
    explanation: "Die Abseitsregel hängt von der Position im Moment des Zuspiels sowie der aktiven Beteiligung ab. Es gibt Ausnahmen, zum Beispiel bei einem Einwurf."
  },
  {
    id: "q6",
    question: "Was hilft einem Team beim Verteidigen besonders?",
    options: [
      "Alle Spieler laufen allein zum Ball",
      "Gemeinsam Räume schließen und sich gegenseitig absichern",
      "Niemand spricht miteinander",
      "Alle stehen direkt am eigenen Tor"
    ],
    answer: 1,
    explanation: "Gute Abstimmung, das Schließen von Räumen und gegenseitige Absicherung helfen einem Team beim Verteidigen."
  }
];

function freshState() {
  return {
    xp: 0,
    name: "Spieler",
    totalCompleted: 0,
    completedToday: {},
    correctQuestions: [],
    quizRewards: {},
    dailyBonuses: [],
    streak: 0,
    lastActiveDate: ""
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return { ...freshState(), ...JSON.parse(saved) };
  } catch (e) {}

  // Versucht, XP aus einer älteren FussballCoach-Version zu übernehmen.
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !/fussball|coach/i.test(key)) continue;
      const old = JSON.parse(localStorage.getItem(key));
      if (old && typeof old.xp === "number") {
        return { ...freshState(), xp: Math.max(0, old.xp) };
      }
    }
  } catch (e) {}

  return freshState();
}

let state = loadState();
let currentScreen = "home";
let quizIndex = 0;
let quizFeedback = null;
let quizFinished = false;
let quizCorrectRound = 0;
let toastTimer = null;

function dateKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function yesterdayKey() {
  const date = new Date();
  date.setDate(date.getDate() - 1);
  return dateKey(date);
}

const today = dateKey();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    showToast("Speichern nicht möglich. Prüfe deine Browser-Einstellungen.");
  }
}

function updateStreak() {
  if (state.lastActiveDate === today) return;
  state.streak = state.lastActiveDate === yesterdayKey()
    ? (Number(state.streak) || 0) + 1
    : 1;
  state.lastActiveDate = today;
  saveState();
}
updateStreak();

function level() {
  return Math.floor(Math.max(0, Number(state.xp) || 0) / 100) + 1;
}

function levelProgress() {
  return Math.max(0, Number(state.xp) || 0) % 100;
}

function completedToday() {
  if (!state.completedToday || typeof state.completedToday !== "object") state.completedToday = {};
  if (!Array.isArray(state.completedToday[today])) state.completedToday[today] = [];
  return state.completedToday[today];
}

function earnedQuizToday() {
  if (!state.quizRewards || typeof state.quizRewards !== "object") state.quizRewards = {};
  if (!Array.isArray(state.quizRewards[today])) state.quizRewards[today] = [];
  return state.quizRewards[today];
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

function goTo(screen) {
  currentScreen = screen;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function progressBar(value, max, labelLeft, labelRight) {
  const percent = max ? Math.min(100, Math.round((value / max) * 100)) : 0;
  return `
    <div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>
    <div class="progress-label"><span>${labelLeft}</span><span>${labelRight}</span></div>
  `;
}

function statCard(icon, value, label) {
  return `<div class="stat"><div class="stat-icon">${icon}</div><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>`;
}

function renderHome() {
  const done = completedToday();
  const count = done.length;
  const dailyDone = count >= EXERCISES.length;
  const displayName = escapeHTML(state.name || "Spieler");

  return `
    <section class="hero">
      <span class="hero-label">⚡ LEVEL ${level()} · DEIN WEG NACH VORN</span>
      <h1>Dein Spiel.<br>Deine Entwicklung.</h1>
      <p>Hey ${displayName}! Jeder gute Spieler beginnt mit dem nächsten Training. Mach heute den ersten Schritt.</p>
      <button class="btn" data-action="start-training">Training starten <span>→</span></button>
    </section>

    <div class="stats-grid">
      ${statCard("⚡", state.xp, "Gesamt-XP")}
      ${statCard("🏅", level(), "Dein Level")}
      ${statCard("🔥", state.streak, "Tage aktiv")}
    </div>

    <div class="section-head">
      <h2>Dein Tagesziel</h2>
      <span class="chip ${dailyDone ? "green" : ""}">${count}/${EXERCISES.length} Übungen</span>
    </div>
    <div class="card">
      <div class="card-top">
        <div class="card-icon">${dailyDone ? "✅" : "🎯"}</div>
        <div class="card-content">
          <h3>${dailyDone ? "Tagesziel erreicht!" : "Eine Übung nach der anderen"}</h3>
          <p>${dailyDone ? "Stark! Du hast alle heutigen Übungen abgeschlossen." : "Schließe Trainingsübungen ab und sammle Erfahrungspunkte."}</p>
        </div>
      </div>
      ${progressBar(count, EXERCISES.length, "Heutiger Fortschritt", `${Math.round(count / EXERCISES.length * 100)}%`)}
      <button class="btn secondary full" style="margin-top:12px" data-action="start-training">${dailyDone ? "Training wiederholen" : "Übungen ansehen"} →</button>
    </div>

    <div class="section-head">
      <h2>Dein Trainingsplan</h2>
      <button class="text-link" data-screen="training">Alle Übungen →</button>
    </div>
    ${EXERCISES.slice(0, 2).map(ex => `
      <div class="card">
        <div class="card-top">
          <div class="card-icon">${ex.icon}</div>
          <div class="card-content">
            <h3>${ex.title}</h3>
            <p>${ex.description}</p>
            <div class="meta"><span class="chip">${ex.duration}</span><span class="chip">${ex.category}</span></div>
          </div>
        </div>
      </div>
    `).join("")}

    <div class="section-head"><h2>Coach-Tipp</h2><span class="chip green">💡 Heute</span></div>
    <div class="notice"><strong>Erst schauen, dann spielen.</strong><br>Gewöhne dir an, vor der Ballannahme kurz über die Schulter zu blicken. So erkennst du freie Räume früher und kannst schneller entscheiden.</div>
  `;
}

function renderExercise(ex) {
  const done = completedToday().includes(ex.id);
  return `
    <article class="card exercise ${done ? "completed" : ""}">
      <div class="card-top">
        <div class="card-icon">${ex.icon}</div>
        <div class="card-content">
          <h3>${ex.title} ${done ? "✓" : ""}</h3>
          <p>${ex.description}</p>
          <div class="meta">
            <span class="chip">${ex.duration}</span>
            <span class="chip">${ex.difficulty}</span>
            <span class="chip green">+20 XP</span>
          </div>
        </div>
      </div>
      <div class="notice"><strong>Dein Fokus: ${ex.focus}</strong></div>
      <ol class="exercise-steps">${ex.steps.map(step => `<li>${step}</li>`).join("")}</ol>
      <div class="exercise-footer">
        <span class="chip">${ex.category}</span>
        <button class="btn ${done ? "secondary" : ""} small" data-action="complete-training" data-id="${ex.id}" ${done ? "disabled" : ""}>
          ${done ? "Heute erledigt ✓" : "Übung abschließen +20 XP"}
        </button>
      </div>
    </article>
  `;
}

function renderTraining() {
  const done = completedToday();
  return `
    <div class="page-intro">
      <div class="eyebrow">AUF DEN PLATZ</div>
      <h1>Trainingsbereich</h1>
      <p>Übe in deinem eigenen Tempo. Achte auf saubere Bewegungen und mache Pausen, wenn du sie brauchst.</p>
    </div>
    <div class="card">
      <div class="card-top">
        <div class="card-icon">📅</div>
        <div class="card-content">
          <h3>Dein heutiges Training</h3>
          <p>${done.length} von ${EXERCISES.length} Aufgaben abgeschlossen</p>
        </div>
      </div>
      ${progressBar(done.length, EXERCISES.length, "Tagesfortschritt", `${done.length}/${EXERCISES.length}`)}
    </div>
    <div class="section-head"><h2>Übungen für dich</h2><span class="chip">6 Übungen</span></div>
    <div class="training-grid">${EXERCISES.map(renderExercise).join("")}</div>
    <div class="notice" style="margin-top:16px">⚠️ <strong>Trainiere sicher:</strong> Wähle einen geeigneten Platz, achte auf deine Umgebung und wärme dich vor intensivem Training auf.</div>
  `;
}

function renderQuiz() {
  if (quizFinished) {
    return `
      <div class="page-intro">
        <div class="eyebrow">RUNDE BEENDET</div>
        <h1>Gut gemacht!</h1>
        <p>Du hast das Fußballwissen-Quiz abgeschlossen.</p>
      </div>
      <div class="hero" style="text-align:center">
        <div style="font-size:52px">🏆</div>
        <h1 style="font-size:34px">${quizCorrectRound} von ${QUESTIONS.length}</h1>
        <p>richtige Antworten in dieser Runde</p>
        <span class="hero-label">⚡ ${state.xp} GESAMT-XP</span>
      </div>
      <button class="btn full" data-action="restart-quiz">Quiz erneut starten ↻</button>
      <button class="btn secondary full" style="margin-top:10px" data-screen="profile">Fortschritt ansehen →</button>
    `;
  }

  const q = QUESTIONS[quizIndex];
  const rewardAlready = earnedQuizToday().includes(q.id);

  return `
    <div class="page-intro">
      <div class="eyebrow">KOPFTRAINING</div>
      <h1>Fußball-Quiz</h1>
      <p>Teste dein Wissen über Technik, Taktik und die Regeln des Spiels.</p>
    </div>
    <div class="card">
      <div class="progress-label"><span>Frage ${quizIndex + 1} von ${QUESTIONS.length}</span><span>🧠 Wissen wächst mit jedem Versuch</span></div>
      ${progressBar(quizIndex + 1, QUESTIONS.length, "Quizfortschritt", `${Math.round((quizIndex + 1) / QUESTIONS.length * 100)}%`)}
      <div style="margin-top:24px">
        <span class="chip green">FRAGE ${String(quizIndex + 1).padStart(2, "0")}</span>
        <h2 style="font-size:22px;line-height:1.4;margin-top:14px">${q.question}</h2>
      </div>
      <div class="quiz-options">
        ${q.options.map((option, i) => {
          let cls = "option";
          if (quizFeedback && i === q.answer) cls += " correct";
          else if (quizFeedback && i === quizFeedback.selected) cls += " wrong";
          return `<button class="${cls}" data-action="answer" data-option="${i}" ${quizFeedback ? "disabled" : ""}><span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${option}</span></button>`;
        }).join("")}
      </div>
      ${quizFeedback ? `
        <div class="feedback ${quizFeedback.correct ? "good" : "bad"}">
          <strong>${quizFeedback.correct ? "✅ Richtig!" : "💪 Weiter üben!"}</strong><br>
          ${q.explanation}<br><br>
          ${quizFeedback.reward ? '<strong style="color:var(--green)">+10 XP verdient!</strong>' : (quizFeedback.correct && rewardAlready ? '<span>Die XP für diese Frage hast du heute bereits erhalten.</span>' : "")}
        </div>
        <button class="btn full" data-action="next-question">${quizIndex === QUESTIONS.length - 1 ? "Ergebnis ansehen" : "Nächste Frage →"}</button>
      ` : `<div class="notice">🏅 Eine richtige Antwort bringt dir <strong>10 XP</strong> – bei jeder Frage höchstens einmal pro Tag.</div>`}
    </div>
  `;
}

function getBadges() {
  return [
    { icon: "👟", title: "Erster Schritt", desc: "Schließe deine erste Übung ab.", unlocked: state.totalCompleted >= 1 },
    { icon: "💪", title: "Dranbleiber", desc: "Schließe insgesamt 5 Übungen ab.", unlocked: state.totalCompleted >= 5 },
    { icon: "🧠", title: "Quiz-Profi", desc: "Beantworte 3 verschiedene Quizfragen richtig.", unlocked: (state.correctQuestions || []).length >= 3 },
    { icon: "⚡", title: "Level 3", desc: "Sammle mindestens 200 XP.", unlocked: state.xp >= 200 },
    { icon: "🔥", title: "Konstant", desc: "Sei an 7 aufeinanderfolgenden Tagen aktiv.", unlocked: state.streak >= 7 },
    { icon: "🎯", title: "Trainingsfleiß", desc: "Schließe insgesamt 10 Übungen ab.", unlocked: state.totalCompleted >= 10 }
  ];
}

function renderProfile() {
  const name = escapeHTML(state.name || "Spieler");
  const badges = getBadges();
  const unlocked = badges.filter(b => b.unlocked).length;

  return `
    <div class="page-intro">
      <div class="eyebrow">DEIN FORTSCHRITT</div>
      <h1>Spielerprofil</h1>
      <p>Hier siehst du, wie du dich Schritt für Schritt entwickelst.</p>
    </div>
    <div class="profile-head">
      <div class="avatar">${name.slice(0,1).toUpperCase()}</div>
      <div>
        <div class="profile-name">${name}</div>
        <div class="meta" style="margin:8px 0 0">
          <span class="chip green">LEVEL ${level()}</span>
          <span class="chip">${state.xp} XP</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Dein nächstes Level</h3>
      <p>Sammle XP durch Training und Quizfragen.</p>
      ${progressBar(levelProgress(), 100, `${levelProgress()} / 100 XP`, `${100 - levelProgress()} XP bis Level ${level() + 1}`)}
      <div class="input-row">
        <input id="player-name" type="text" maxlength="20" value="${name}" aria-label="Spielername" placeholder="Dein Spielername">
        <button class="btn small" data-action="save-name">Speichern</button>
      </div>
    </div>

    <div class="section-head"><h2>Deine Statistiken</h2></div>
    <div class="stats-grid">
      ${statCard("⚽", state.totalCompleted, "Übungen erledigt")}
      ${statCard("🧠", (state.correctQuestions || []).length, "Quizfragen richtig")}
      ${statCard("🏆", unlocked, "Abzeichen")}
    </div>

    <div class="section-head"><h2>Deine Abzeichen</h2><span class="chip">${unlocked}/${badges.length}</span></div>
    <div class="badges">
      ${badges.map(b => `
        <div class="badge-card ${b.unlocked ? "unlocked" : ""}">
          <div class="badge-emoji">${b.icon}</div>
          <div class="badge-title">${b.title}</div>
          <div class="badge-desc">${b.unlocked ? "Freigeschaltet! " : "Noch gesperrt · "}${b.desc}</div>
        </div>
      `).join("")}
    </div>

    <div class="section-head"><h2>Deine Daten</h2></div>
    <div class="card">
      <p>Dein Fortschritt wird lokal in diesem Browser gespeichert. Er ist nicht mit einem Konto synchronisiert.</p>
      <button class="btn ghost full" data-action="reset-progress">Fortschritt zurücksetzen</button>
    </div>
  `;
}

function render() {
  const main = document.getElementById("main");
  const screens = {
    home: renderHome,
    training: renderTraining,
    quiz: renderQuiz,
    profile: renderProfile
  };
  main.innerHTML = (screens[currentScreen] || renderHome)();

  document.querySelectorAll(".nav-item").forEach(btn => {
    const active = btn.dataset.screen === currentScreen;
    btn.classList.toggle("active", active);
    if (active) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });
}

function completeTraining(id) {
  const ex = EXERCISES.find(item => item.id === id);
  if (!ex) return;

  const done = completedToday();
  if (done.includes(id)) {
    showToast("Diese Übung ist heute schon erledigt.");
    return;
  }

  done.push(id);
  state.xp += 20;
  state.totalCompleted = (Number(state.totalCompleted) || 0) + 1;

  let message = "+20 XP – Übung abgeschlossen!";
  if (!state.dailyBonuses.includes(today)) {
    state.dailyBonuses.push(today);
    state.xp += 10;
    message = "+30 XP – inklusive Tagesbonus!";
  }

  saveState();
  render();
  showToast(message);
}

function answerQuestion(option) {
  if (quizFeedback || quizFinished) return;
  const q = QUESTIONS[quizIndex];
  if (!q) return;

  const selected = Number(option);
  if (!Number.isInteger(selected) || selected < 0 || selected >= q.options.length) return;

  const correct = selected === q.answer;
  let reward = false;

  if (correct) {
    quizCorrectRound++;
    if (!earnedQuizToday().includes(q.id)) {
      earnedQuizToday().push(q.id);
      if (!Array.isArray(state.correctQuestions)) state.correctQuestions = [];
      if (!state.correctQuestions.includes(q.id)) state.correctQuestions.push(q.id);
      state.xp += 10;
      reward = true;
    }
  }

  quizFeedback = { correct, selected, reward };
  saveState();
  render();
}

function nextQuestion() {
  if (!quizFeedback) return;
  if (quizIndex >= QUESTIONS.length - 1) {
    quizFinished = true;
  } else {
    quizIndex++;
    quizFeedback = null;
  }
  render();
}

function restartQuiz() {
  quizIndex = 0;
  quizFeedback = null;
  quizFinished = false;
  quizCorrectRound = 0;
  render();
}

function resetProgress() {
  const confirmed = window.confirm("Möchtest du wirklich deinen gesamten FussballCoach-Fortschritt zurücksetzen? Dieser Schritt kann nicht rückgängig gemacht werden.");
  if (!confirmed) return;

  state = freshState();
  state.lastActiveDate = today;
  state.streak = 1;
  saveState();
  quizIndex = 0;
  quizFeedback = null;
  quizFinished = false;
  quizCorrectRound = 0;
  goTo("home");
  showToast("Dein Fortschritt wurde zurückgesetzt.");
}

document.addEventListener("click", event => {
  const screenButton = event.target.closest("[data-screen]");
  if (screenButton) {
    goTo(screenButton.dataset.screen);
    return;
  }

  const button = event.target.closest("[data-action]");
  if (!button) return;

  const action = button.dataset.action;
  if (action === "start-training") goTo("training");
  if (action === "complete-training") completeTraining(button.dataset.id);
  if (action === "answer") answerQuestion(button.dataset.option);
  if (action === "next-question") nextQuestion();
  if (action === "restart-quiz") restartQuiz();

  if (action === "save-name") {
    const input = document.getElementById("player-name");
    const cleaned = input ? input.value.trim().slice(0, 20) : "";
    state.name = cleaned || "Spieler";
    saveState();
    render();
    showToast("Spielerprofil gespeichert!");
  }

  if (action === "reset-progress") resetProgress();
});

render();
</script>
</body>
</html>
